<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>Personality Spectrum — Orientation Check</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #101014 0%, #17171d 50%, #101014 100%);
            --card-bg: rgba(27, 27, 34, 0.96);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f1f6;
            --text-muted: #a19da9;
            --accent-primary: #ef4444;
            --accent-hover: #f87171;
            --accent-success: #10b981;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(239, 68, 68, 0.15);
            --btn-border: rgba(255, 255, 255, 0.12);
            --fluid-padding: clamp(1.5rem, 5vw, 2.5rem);
            --fluid-radius: clamp(12px, 2vw, 24px);
            --font-title: clamp(1.5rem, 4vw, 2.2rem);
            --font-body: clamp(0.95rem, 2vw, 1.1rem);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: var(--fluid-padding);
            border-radius: var(--fluid-radius);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 650px;
            width: 100%;
        }
        h1 {
            font-size: var(--font-title);
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #f87171 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: calc(var(--font-body) * 0.85);
            margin-bottom: 2rem;
        }
        .progress-wrapper {
            height: 6px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            margin-bottom: 2.5rem;
            border-radius: 100px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary) 0%, #991b1b 100%);
            border-radius: 100px;
            transition: width 0.3s ease;
        }
        .question-box {
            font-size: var(--font-body);
            font-weight: 600;
            margin-bottom: 2rem;
            color: #ffffff;
            min-height: 60px;
            white-space: pre-line;
        }
        .options-wrapper { display: flex; flex-direction: column; gap: 1rem; }
        .interactive-btn {
            background: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--btn-border);
            padding: clamp(1rem, 3vw, 1.3rem) clamp(1.2rem, 4vw, 1.8rem);
            border-radius: calc(var(--fluid-radius) * 0.7);
            cursor: pointer;
            font-size: calc(var(--font-body) * 0.95);
            font-weight: 500;
            text-align: left;
            line-height: 1.4;
            transition: all 0.2s ease;
        }
        .interactive-btn:hover {
            background: var(--btn-hover);
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }
        .view-hidden { display: none !important; }
        .result-badge {
            color: var(--accent-success);
            font-size: calc(var(--font-title) * 1.1);
            font-weight: 800;
            margin: 1.5rem 0;
        }
        .result-card {
            text-align: left;
            background: rgba(0, 0, 0, 0.24);
            padding: 1.5rem;
            border-radius: calc(var(--fluid-radius) * 0.7);
            border-left: 4px solid var(--accent-primary);
            margin-bottom: 2rem;
            font-size: calc(var(--font-body) * 0.95);
            color: #d1cbd8;
        }
        .action-trigger-btn {
            background: var(--accent-primary);
            color: #ffffff;
            font-weight: 700;
            text-align: center;
            border: none;
            width: 100%;
            padding: 1rem;
            border-radius: calc(var(--fluid-radius) * 0.7);
            font-size: var(--font-body);
            cursor: pointer;
        }
        .action-trigger-btn:hover { background: var(--accent-hover); }
    </style>
</head>
<body>

<main class="container">
    <!-- QUIZ BERICH -->
    <section id="quiz-view">
        <header>
            <h1 id="ui-title">Orientierungs-Check</h1>
            <p id="ui-subtitle" class="subtitle">Antworte ehrlich für ein mathematisch präzises Ergebnis.</p>
        </header>
        <div class="progress-wrapper">
            <div id="ui-progress" class="progress-bar-fill"></div>
        </div>
        <article>
            <div id="ui-question" class="question-box"></div>
            <div id="ui-options" class="options-wrapper"></div>
        </article>
    </section>

    <!-- ERGEBNIS BEREICH -->
    <section id="result-view" class="view-hidden">
        <header>
            <h1>Dein Ergebnis</h1>
        </header>
        <div id="ui-result-badge" class="result-badge"></div>
        <p id="ui-result-desc" class="result-card"></p>
        <button class="action-trigger-btn" id="ui-restart">Test wiederholen</button>
    </section>
</main>

{ t: "Wenn du emotionale Musik hörst – an welches Geschlecht denkst du?", o: [{ x: "Ich stelle mir in meinen Tagträumen immer ein Mädchen vor.", s: { h: 2, b: 0, p: 0 } }, { x: "Je nach Stimmung stelle ich mir mal einen Jungen oder ein Mädchen vor.", s: { h: 0, b: 2, p: 0 } }, { x: "Ich denke an ein Gefühl, das Geschlecht ist dabei vollkommen fließend.", s: { h: 0, b: 0, p: 2 } }] },

let currentIndex = 0;
let scores = { h: 0, b: 0, p: 0 };
function initQuiz() {
document.getElementById("ui-restart").addEventListener("click", resetQuiz);
showQuestion();
}
function showQuestion() {
const pct = (currentIndex / dataset.questions.length) * 100;
document.getElementById("ui-progress").style.width = pct + "%";
const q = dataset.questions[currentIndex];
document.getElementById("ui-question").innerText = "Frage " + (currentIndex + 1) + " von 42:\n" + q.t;
const box = document.getElementById("ui-options");
box.innerHTML = "";
q.o.forEach(option => {
const btn = document.createElement("button");
btn.className = "interactive-btn";
btn.innerText = option.x;
btn.addEventListener("click", () => handleAnswer(option.s));
box.appendChild(btn);
});
}
function handleAnswer(optionScores) {
scores.h += optionScores.h || 0;
scores.b += optionScores.b || 0;
scores.p += optionScores.p || 0;
currentIndex++;
if (currentIndex < dataset.questions.length) {
showQuestion();
} else {
showResult();
}
}
function showResult() {
document.getElementById("ui-progress").style.width = "100%";
setTimeout(() => {
document.getElementById("quiz-view").classList.add("view-hidden");
document.getElementById("result-view").classList.remove("view-hidden");
let finalKey = "h";
let maxScore = -1;
if (scores.h > maxScore) { maxScore = scores.h; finalKey = "h"; }
if (scores.b > maxScore) { maxScore = scores.b; finalKey = "b"; }
if (scores.p > maxScore) { maxScore = scores.p; finalKey = "p"; }
const outcome = dataset.results[finalKey];
document.getElementById("ui-result-badge").innerText = outcome.n;
document.getElementById("ui-result-desc").innerText = outcome.d;
}, 200);
}
function resetQuiz() {
currentIndex = 0;
scores = { h: 0, b: 0, p: 0 };
document.getElementById("quiz-view").classList.remove("view-hidden");
document.getElementById("result-view").classList.add("view-hidden");
showQuestion();
}
document.addEventListener("DOMContentLoaded", initQuiz);

</script>
